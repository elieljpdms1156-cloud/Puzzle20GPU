name: Build Windows EXE com GPU
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Instalar dependências via vcpkg
        run: |
          vcpkg install secp256k1 opencl
          echo "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
      - name: Compilar (com /MT para link estático)
        run: |
          cl /O2 /nologo /MT /Fe:puzzle_gpu.exe puzzle_gpu_multi.c ripemd160.c `
            /I"$env:VCPKG_ROOT\installed\x64-windows\include" `
            /link `
            "$env:VCPKG_ROOT\installed\x64-windows\lib\libsecp256k1.lib" `
            "$env:VCPKG_ROOT\installed\x64-windows\lib\OpenCL.lib" `
            user32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle_gpu
          path: |
            puzzle_gpu.exe
            kernel.cl
