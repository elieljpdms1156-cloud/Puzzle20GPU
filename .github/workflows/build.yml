name: Build Windows EXE com GPU
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Instalar OpenCL SDK
        run: |
          Invoke-WebRequest -Uri https://github.com/KhronosGroup/OpenCL-SDK/releases/download/v2023.12.14/OpenCL-SDK-v2023.12.14-Win64.zip -OutFile opencl.zip
          Expand-Archive opencl.zip -DestinationPath opencl
          echo "OPENCL_ROOT=$env:GITHUB_WORKSPACE/opencl" >> $env:GITHUB_ENV
      - name: Instalar libsecp256k1 via vcpkg
        run: |
          vcpkg install secp256k1:x64-windows
          echo "SECP256K1_ROOT=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
      - name: Compilar
        run: |
          cl /O2 /nologo /Fe:puzzle_gpu.exe puzzle_gpu.c ripemd160.c `
            /I"$env:OPENCL_ROOT/include" `
            /I"$env:SECP256K1_ROOT/include" `
            /link `
            "$env:OPENCL_ROOT/lib/OpenCL.lib" `
            "$env:SECP256K1_ROOT/lib/secp256k1.lib" `
            user32.lib
      - uses: actions/upload-artifact@v4
        with:
          name: puzzle_gpu
          path: puzzle_gpu.exe
